<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
    <link rel="stylesheet" href="/styles/site.css">
    <title>Cat Shelter</title>
</head>

<body>
    <header>
        <nav>
            <ul class="navigation">
                <li><a href="/">Home Page</a></li>
                <li><a href="/cats/add-breed">Add Breed</a></li>
                <li><a href="/cats/add-cat">Add Cat</a></li>
            </ul>
        </nav>
        <h1>Cat Shelter</h1>
    </header>
    <main>
        <form action="/cats/add-cat" method="post" class="cat-form">
            <h2>Add Cat</h2>

            <label for="name">Name</label>
            <input name="name" type="text" id="name">

            <label for="description">Description</label>
            <textarea name="description" id="description"></textarea>
            
            <label for="imageURL">Image URL</label>
            <input name="imageURL" type="text" id="imageURL">

            <label for="group">Breed</label>
            <select name="breedName" id="group">
                <option selected disabled value="">select a breed</option>
                {{Breed items}}
            </select>

            <button type="submit">Add Cat</button>
        </form>
    </main>
</body>

</html>
